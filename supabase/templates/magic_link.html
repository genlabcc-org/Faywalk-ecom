<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Your Login - Anika Fashion</title>
  <style>
    body {
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #faf9f6;
      color: #1a1a1a;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      width: 100%;
      min-height: 100vh;
      background-color: #faf9f6;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      border: 1px solid #e5e5e0;
    }
    .header {
      background-color: #1a1a1a;
      color: #ffffff;
      text-align: center;
      padding: 30px 20px;
    }
    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin: 0;
      color: #d4af37; /* Elegant gold tint */
    }
    .subtitle {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 5px 0 0 0;
      opacity: 0.8;
    }
    .content {
      padding: 40px 30px;
      text-align: center;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 20px;
      color: #1a1a1a;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #555555;
      margin-bottom: 30px;
    }
    .otp-container {
      background-color: #f6f5f0;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
      border: 1px dashed #d4af37;
      display: inline-block;
    }
    .otp-code {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 8px;
      color: #1a1a1a;
      margin: 0;
    }
    .footer {
      background-color: #fcfbfa;
      border-top: 1px solid #e5e5e0;
      padding: 20px;
      text-align: center;
      font-size: 12px;
      color: #888888;
    }
    .footer a {
      color: #d4af37;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <h2 class="logo">Anika</h2>
        <div class="subtitle">Fashion &amp; Couture</div>
      </div>
      <div class="content">
        <h1>Verify Your Identity</h1>
        <p>Please use the following 6-digit verification code to complete your login. This code will expire in 1 hour.</p>
        <div class="otp-container">
          <div class="otp-code">{{ .Token }}</div>
        </div>
        <p style="font-size: 13px; color: #888888; margin-top: 20px;">If you did not request this code, you can safely ignore this email.</p>
      </div>
      <div class="footer">
        <p>&copy; 2026 Anika Fashion. All rights reserved.</p>
        <p><a href="{{ .SiteURL }}">Visit Our Store</a></p>
      </div>
    </div>
  </div>
</body>
</html>
